[project]
name = "phi-deid"
version = "1.0.0"
description = "Shared code for benchmarking Qwen3 LLM/VLM de-identification of clinical text and medical images"
requires-python = ">=3.10"
dependencies = ["pandas", "pydantic>=2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phi_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
